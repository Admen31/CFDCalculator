[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-signal-calculator"
version = "2.4.0"
description = "CFD Signal Calculator - desktop signal helper for Trading 212 (no automatic trading)"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",      # GUI + screen capture (QScreen.grabWindow)
    "rapidocr-onnxruntime>=1.3",    # offline OCR of the instrument name, no external install
    "numpy",
    "tzdata",                       # zoneinfo data on Windows (evening cut-off in local time)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
cfd-signal-calculator = "cfdcalc.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
