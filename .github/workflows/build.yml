name: CFD Signal Calculator

on:
  push:
    branches: [main, "v2.0-auto-recognition", "v2.1-signal-and-smooth-ui", "v2.2-research-backtest",
               "v2.2.1-xagusd-data-fix", "v2.3-smart-signals-color-ui",
               "v2.4-risk-position-sizing", "v2.5-multi-provider-market-coverage",
               "v2.6-instant-market-direction"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Coverage audit (public Twelve Data + Coinbase endpoints, no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit
        run: python scripts/coverage_audit.py --out audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-audit
          path: audit
          retention-days: 30
          if-no-files-found: ignore
  windows:
    name: Tests + Windows EXE
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Lint (ruff)
        run: ruff check --select F,E9,B,E --line-length 120 src tests scripts
      - name: Tests (offscreen Qt, network blocked in tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider
      - name: Response time START -> result (mocked API 300 ms per request)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -s -p no:cacheprovider tests/test_latency.py
      - name: End-to-end on the real Windows desktop (Win32 window search, capture, OCR, UI)
        env:
          CFD_E2E: "1"
          CFD_E2E_OUT: e2e-out
          PYTHONIOENCODING: utf-8
        run: python -m pytest -p no:cacheprovider -s -rA --durations=5 -o faulthandler_timeout=90 tests/test_windows_e2e.py
      - name: Twelve Data symbol mapping (informational, network)
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/verify_symbols.py
      - name: Twelve Data diagnostics XAG/USD, XAU/USD, EUR/USD (public checks; with key only if the secret exists)
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/td_probe.py
      - name: Strategy comparison v2.0 vs v2.1 on real historical prices (informational, network)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/compare_strategies.py --out comparison.md
      - name: v2.3 strategy lab - WAIT diagnostics and out-of-sample test of the new strategies (network)
        if: always()
        continue-on-error: true
        timeout-minutes: 40
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/strategy_lab.py --out lab --workers 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: strategy-lab
          path: lab
          retention-days: 30
          if-no-files-found: ignore
      - name: Build EXE (PyInstaller, folder build)
        run: pyinstaller --noconfirm --clean --windowed --name "CFD Signal Calculator" --collect-all rapidocr_onnxruntime --paths src src/cfdcalc/__main__.py
      - name: EXE starts and keeps running
        run: |
          $p = Start-Process -FilePath "dist/CFD Signal Calculator/CFD Signal Calculator.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "EXE exited early with code $($p.ExitCode)"; exit 1 }
          Write-Output "EXE is running (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfd-signal-calculator-windows
          path: dist/CFD Signal Calculator
          retention-days: 14
      - name: Month key for the historical data cache
        id: month
        run: echo "month=$(Get-Date -Format yyyy-MM)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: research/cache
          key: dukascopy-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: dukascopy-
      - name: v2.2 research backtest on real historical prices (12 months, informational, network)
        # manual runs only: the Dukascopy feed throttles GitHub runners (HTTP 503 / timeouts, 54 files in 42 min)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 60
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/research.py --months 12 --out research/report --workers 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: research-report
          path: research/report
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: strategy-comparison
          path: comparison.md
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out
          retention-days: 14
          if-no-files-found: ignore
